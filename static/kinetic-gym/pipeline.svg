<svg class="wa" viewBox="0 0 1000 580" role="img" aria-labelledby="kp-title">
<title id="kp-title">How KineticGym fits together. Workshop generates task families, the owner gate checks every level, and each task is a family, level and seed. In a Prime sandbox the agent writes a controller that sends actions to the realtime simulator and gets frames and sensors back. The simulator's verdict feeds pass@k results and the RL reward, and RL updates the agent's model.</title>
<defs>
<marker id="kp-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="wa-head" d="M0 0 L10 5 L0 10 z"/></marker>
</defs>
