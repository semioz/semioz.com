<rect class="wa-node wa-owner" x="380" y="266" width="220" height="100" rx="14"/>
<rect class="wa-node wa-output" x="700" y="274" width="260" height="84" rx="14"/>
<rect class="wa-node wa-output" x="380" y="474" width="220" height="84" rx="14"/>
</g>
