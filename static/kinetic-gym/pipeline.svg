</g>
<g class="wa-text" text-anchor="middle" font-size="19">
<text class="wa-title" x="170" y="76" font-size="24">Workshop</text><text x="170" y="104">generates task families</text>
<text class="wa-title" x="500" y="76" font-size="24">Owner gate</text><text x="500" y="104">checks every level</text>
<text class="wa-title" x="830" y="76" font-size="24">Task</text><text x="830" y="104">family · level · seed</text>
<text x="505" y="154" font-size="16">one episode</text>
<text x="62" y="234" text-anchor="start" font-size="16">Prime sandbox</text>
<text class="wa-title" x="180" y="309" font-size="24">Agent</text><text x="180" y="337">writes a controller</text>
<text class="wa-title" x="490" y="309" font-size="24">Simulator</text><text x="490" y="337">realtime MuJoCo</text>
<text class="wa-title" x="830" y="310" font-size="24">Results</text><text x="830" y="338">pass@k per level</text>
<text class="wa-title" x="490" y="524" font-size="24">RL</text>
<text x="335" y="288" font-size="15">actions</text>
<text x="335" y="356" font-size="15">frames</text>
<text x="645" y="306" font-size="15">verdict</text>
