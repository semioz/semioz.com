</g>
<g class="wa-text" text-anchor="middle" font-size="19">
<text class="wa-title" x="170" y="76" font-size="24">Workshop</text><text x="170" y="104">generates task families</text>
<text class="wa-title" x="500" y="76" font-size="24">Owner gate</text><text x="500" y="104">keeps levels that pass</text>
<text class="wa-title" x="830" y="76" font-size="24">Task</text><text x="830" y="104">family · level · seed</text>
<text x="590" y="160">one episode</text>
<text x="66" y="244" text-anchor="start">Prime sandbox</text>
<text class="wa-title" x="185" y="316" font-size="24">Agent</text><text x="185" y="344">writes a controller</text>
<text class="wa-title" x="485" y="316" font-size="24">Simulator</text><text x="485" y="344">realtime MuJoCo</text>
<text class="wa-title" x="830" y="318" font-size="24">Results</text><text x="830" y="346">pass@k per level</text>
<text class="wa-title" x="360" y="500" font-size="24">RL</text><text x="360" y="526">conveyor family</text>
<text x="329" y="296" font-size="16">actions</text>
<text x="341" y="364" font-size="16">frames</text>
