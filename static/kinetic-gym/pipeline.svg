<svg class="wa" viewBox="0 0 1000 560" role="img" aria-labelledby="kp-title">
<title id="kp-title">How KineticGym fits together. Workshop generates task families, the owner gate keeps the levels that pass, and each task is a family, level and seed. In a Prime sandbox the agent writes a controller that sends actions to the realtime simulator and gets frames and sensors back. The simulator's verdict feeds pass@k results and the RL reward, and RL trains the agent's model.</title>
